# ============================================================================
#  PRICES  -  one section per MODEL, keyed by the model name in settings.env.
#
#  * The agent reads the model names from settings.env and looks for the
#    section with that exact name here. No section / empty price = UNPRICED.
#    An old model's price is NEVER used for a new model: when you change a
#    model in settings.env, price_check.py asks for the new price at startup
#    and adds a new section below. The old section stays, so switching back
#    needs no typing.
#  * Fill in the numbers from each provider's pricing page.
#    EMPTY = not filled in yet (shows as UNPRICED).  0 = free.
#  * You can edit this file WHILE the agent is running: the next reply uses it.
#    Rows already in cost_log.csv keep the price that was valid at that time.
#  * Mixed currencies are fine: each section has its own `currency`; below,
#    say how much 1 USD is worth in your report currency.
# ============================================================================

[general]
# Currency every total is shown in.
currency = INR

[exchange_rates]
# How many units of the report currency (above) one unit of the currency below is worth.
# Only needed for currencies that differ from the report currency.
# Example: report currency INR and a provider priced in USD -> USD = 88.0
USD = 94.91


# ---------------------------------------------------------------------------
#  LLM  -  Groq.  Billed per 1,000,000 tokens.   Section: [llm:<GROQ_LLM_MODEL>]
#  "cached input" = prompt tokens served from cache; leave it empty if Groq
#  gives no discount (the input price is used). Completion tokens (incl.
#  reasoning tokens) are billed as output.
# ---------------------------------------------------------------------------
[llm:openai/gpt-oss-20b]
currency = USD
input_per_million = 0.075
cached_input_per_million = 0.037
output_per_million = 0.30


# ---------------------------------------------------------------------------
#  TTS  -  Sarvam Bulbul.  Billed per 10,000 characters.   Section: [tts:<TTS_MODEL>]
#  Counts every character sent to the synthesiser, including the "let me
#  check" filler clips that are rendered once at startup.
# ---------------------------------------------------------------------------
[tts:bulbul:v4-flash]
currency = INR
per_10k_chars = 20.00


# ---------------------------------------------------------------------------
#  STT  -  Sarvam realtime.  Billed per hour of audio.   Section: [stt:<STT_MODEL>]
# ---------------------------------------------------------------------------
[stt:saaras:v3-realtime]
currency = INR
per_hour =29.4


# ---------------------------------------------------------------------------
#  Web search  -  Tavily.  Billed per credit. The agent counts the credits
#  actually used (ultra-fast/fast/basic = 1, advanced = 2), so changing
#  TAVILY_DEPTH needs no price change. Hedged/retried/prefetched requests count.
#  Only needed if TAVILY_API_KEY is set.
# ---------------------------------------------------------------------------
[search_tavily]
currency = USD
per_credit = 0.008


# ---------------------------------------------------------------------------
#  Web search  -  Exa.  Billed per request.  Only needed if EXA_API_KEY is set.
# ---------------------------------------------------------------------------
[search_exa]
currency = USD
per_request = 0.004


# ---------------------------------------------------------------------------
#  Weather  -  Open-Meteo.  Free for non-commercial use: leave empty.
# ---------------------------------------------------------------------------
[weather_open_meteo]
currency = USD
per_call =

# Not tracked: LiveKit Cloud / hosting / bandwidth. If you pay for those,
# they are not in these totals.

[stt:stt-rt-v5]
per_hour = 0.12
currency = USD

[stt:scribe_v2_realtime]
per_hour = 0.39
currency = USD

[tts:standard]
per_10k_chars = 0.39
currency = INR
